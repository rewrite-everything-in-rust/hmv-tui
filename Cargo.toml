[package]
name = "hmv"
version = "1.0.0"
edition = "2021"
description = "HMV-TUI: HackMyVM Advanced Versatile Operations Toolkit — an interactive terminal dashboard for machine management"
license = "MIT"
authors = ["Ouba"]

[dependencies]
anyhow = "1"
aes = "0.9"
base64 = "0.22"
cbc = "0.2"
ctr = "0.10"
futures-util = "0.3"
home = "0.5"
keyring = { version = "3", features = ["linux-native", "sync-secret-service", "windows-native", "apple-native"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "json",
    "stream",
    "gzip",
    "http2",
    "charset",
] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bin]]
name = "hmv"
path = "src/main.rs"
